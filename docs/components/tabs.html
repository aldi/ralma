    <header class="bd-header">

    <section class="section pt-2">
      <div class="container">
        <div class="bd-example">
          <div class="tabs is-boxed">
            <ul>
              <li class="is-active">
                <a href="#">
                  <span class="icon is-small"><i class="fas fa-image" aria-hidden="true"></i></span>

              <li>
                <a href="#">
                  <span class="icon is-small"><i class="fas fa-film" aria-hidden="true"></i></span>
                  <span>Videos</span>
                </a>
              </li>
            </ul>
          </div>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;div class=&quot;tabs is-boxed&quot;&gt;
  &lt;ul&gt;
    &lt;li class=&quot;is-active&quot;&gt;&lt;a href=&quot;#&quot;&gt;Pictures&lt;/a&gt;&lt;/li&gt;

    &lt;li&gt;&lt;a href=&quot;#&quot;&gt;Videos&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;</code></pre>
        </figure>

        <div class="content">
          <p><strong>Ralma</strong> template example:</p>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;tabs boxed&gt;
  &lt;tab active&gt;
    &lt;tab-link href=&quot;#&quot;&gt;
      &lt;span class=&quot;icon is-small&quot;&gt;&lt;i class=&quot;fas fa-image&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
      &lt;span&gt;Pictures&lt;/span&gt;
    &lt;/tab-link&gt;
  &lt;/tab&gt;
  &lt;tab&gt;&lt;tab-link href=&quot;#&quot;&gt;Music&lt;/tab-link&gt;&lt;/tab&gt;
  &lt;tab&gt;&lt;tab-link href=&quot;#&quot;&gt;Videos&lt;/tab-link&gt;&lt;/tab&gt;
&lt;/tabs&gt;</code></pre>
