    <header class="bd-header">
      <div class="bd-header-titles">
        <h1 class="title">Pagination</h1>
        <p class="subtitle is-4">Paginated navigation with previous/next and page links</p>
      </div>
    </header>

    <section class="section pt-2">
      <div class="container">
        <div class="bd-example" style="max-width: 720px">
          <nav class="pagination" role="navigation" aria-label="pagination">
            <a class="pagination-previous" href="#">Previous</a>
            <a class="pagination-next" href="#">Next page</a>
            <ul class="pagination-list">
              <li><a class="pagination-link" aria-label="Goto page 1" href="#">1</a></li>
              <li><span class="pagination-ellipsis">&hellip;</span></li>
              <li><a class="pagination-link is-current" aria-label="Page 10" aria-current="page" href="#">10</a></li>
              <li><a class="pagination-link" aria-label="Goto page 11" href="#">11</a></li>
              <li><a class="pagination-link" aria-label="Goto page 12" href="#">12</a></li>
            </ul>
          </nav>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;nav class=&quot;pagination&quot; role=&quot;navigation&quot; aria-label=&quot;pagination&quot;&gt;
  &lt;a class=&quot;pagination-previous&quot; href=&quot;#&quot;&gt;Previous&lt;/a&gt;
  &lt;a class=&quot;pagination-next&quot; href=&quot;#&quot;&gt;Next page&lt;/a&gt;
  &lt;ul class=&quot;pagination-list&quot;&gt;
    &lt;li&gt;&lt;a class=&quot;pagination-link&quot; aria-label=&quot;Goto page 1&quot; href=&quot;#&quot;&gt;1&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;pagination-ellipsis&quot;&gt;&amp;hellip;&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;a class=&quot;pagination-link is-current&quot; aria-current=&quot;page&quot; href=&quot;#&quot;&gt;10&lt;/a&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/nav&gt;</code></pre>
        </figure>

        <div class="content">
          <p><strong>Ralma</strong> template example:</p>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;pagination&gt;
  &lt;pagination-previous href=&quot;#&quot;&gt;Previous&lt;/pagination-previous&gt;
  &lt;pagination-next href=&quot;#&quot;&gt;Next page&lt;/pagination-next&gt;
  &lt;pagination-list&gt;
    &lt;li&gt;&lt;pagination-link href=&quot;#&quot; ariaLabel=&quot;Goto page 1&quot;&gt;1&lt;/pagination-link&gt;&lt;/li&gt;
    &lt;li&gt;&lt;pagination-ellipsis /&gt;&lt;/li&gt;
    &lt;li&gt;&lt;pagination-link current href=&quot;#&quot; ariaLabel=&quot;Page 10&quot;&gt;10&lt;/pagination-link&gt;&lt;/li&gt;
  &lt;/pagination-list&gt;
&lt;/pagination&gt;</code></pre>
        </figure>
      </div>
    </section>
