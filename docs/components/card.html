    <section class="section pt-2">
      <div class="container">
        <div class="bd-example" style="max-width: 420px">
          <div class="card">
            <header class="card-header">
              <p class="card-header-title">Component</p>
              <button class="card-header-icon" aria-label="more options" type="button">
                <span class="icon"><i class="fas fa-angle-down" aria-hidden="true"></i></span>

            </header>
            <div class="card-content">
              <div class="content">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                <a href="#">@bulmaio</a>.
              </div>
            </div>
            <footer class="card-footer">
              <a href="#" class="card-footer-item">Save</a>
              <a href="#" class="card-footer-item">Edit</a>
              <a href="#" class="card-footer-item">Delete</a>
            </footer>
          </div>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;div class=&quot;card&quot;&gt;
  &lt;header class=&quot;card-header&quot;&gt;
    &lt;p class=&quot;card-header-title&quot;&gt;Component&lt;/p&gt;

    &lt;/button&gt;
  &lt;/header&gt;
  &lt;div class=&quot;card-content&quot;&gt;
    &lt;div class=&quot;content&quot;&gt;...&lt;/div&gt;
  &lt;/div&gt;
  &lt;footer class=&quot;card-footer&quot;&gt;
    &lt;a href=&quot;#&quot; class=&quot;card-footer-item&quot;&gt;Save&lt;/a&gt;
    &lt;a href=&quot;#&quot; class=&quot;card-footer-item&quot;&gt;Edit&lt;/a&gt;
    &lt;a href=&quot;#&quot; class=&quot;card-footer-item&quot;&gt;Delete&lt;/a&gt;
  &lt;/footer&gt;
&lt;/div&gt;</code></pre>
