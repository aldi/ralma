<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ralma - Navbar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" integrity="sha384-DCY3M8xLkMu6c9IKcKbe+jHKMjelnwC0p+SBaxfHxoBYZWdJF2X400UdBCgATtAB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/styles.css" />
    <script defer src="https://use.fontawesome.com/releases/v5.11.2/js/all.js" integrity="sha384-b3ua1l97aVGAPEIe48b4TC60WUQbQaGi2jqAWM90y0OZXZeyaTCWtBTKtjW2GXG1" crossorigin="anonymous"></script>
    <script defer src="../js/scripts.js"></script>
  </head>
  <body>
    <a href="https://github.com/aldi/ralma"
      ><img
        style="position: absolute; top: 0; left: 0; border: 0"
        src="https://camo.githubusercontent.com/c6625ac1f3ee0a12250227cf83ce904423abf351/68747470733a2f2f73332e616d617a6f6e6177732e636f6d2f6769746875622f726962626f6e732f666f726b6d655f6c6566745f677261795f3664366436642e706e67"
        alt="Fork me on GitHub"
        data-canonical-src="https://s3.amazonaws.com/github/ribbons/forkme_left_gray_6d6d6d.png"
    /></a>

    <div class="column has-text-centered">
      <p class="title is-2">Ralma</p>
      <p class="subtitle is-4">Ractive Components for Bulma</p>
    </div>

    <nav class="breadcrumb is-centered" aria-label="breadcrumbs">
      <ul>
        <li>
          <a href="../../index.html">
            <span class="icon is-small"><i class="fas fa-home" aria-hidden="true"></i></span>
            <span>Ralma</span>
          </a>
        </li>
        <li>
          <a href="../../index.html#components">
            <span class="icon is-small"><i class="fas fa-cubes" aria-hidden="true"></i></span>
            <span>Components</span>
          </a>
        </li>
        <li class="is-active"><a href="#" aria-current="page">Navbar</a></li>
      </ul>
    </nav>

    <header class="bd-header">
      <div class="bd-header-titles">
        <h1 class="title">Navbar</h1>
        <p class="subtitle is-4">Responsive navigation header with dropdowns</p>
      </div>
    </header>

    <section class="section pt-2">
      <div class="container">
        <div class="bd-example">
          <nav class="navbar is-light" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
              <a class="navbar-item" href="#">
                <strong>Ralma</strong>
              </a>
              <a
                role="button"
                class="navbar-burger"
                aria-label="menu"
                aria-expanded="false"
                data-target="navbarBasicExample"
              >
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
              </a>
            </div>
            <div id="navbarBasicExample" class="navbar-menu">
              <div class="navbar-start">
                <a class="navbar-item" href="#">Home</a>
                <div class="navbar-item has-dropdown is-hoverable">
                  <a class="navbar-link">More</a>
                  <div class="navbar-dropdown">
                    <a class="navbar-item" href="#">About</a>
                    <a class="navbar-item" href="#">Jobs</a>
                    <hr class="navbar-divider" />
                    <a class="navbar-item" href="#">Report an issue</a>
                  </div>
                </div>
              </div>
              <div class="navbar-end">
                <div class="navbar-item">
                  <div class="buttons">
                    <a class="button is-primary" href="#"><strong>Sign up</strong></a>
                    <a class="button is-light" href="#">Log in</a>
                  </div>
                </div>
              </div>
            </div>
          </nav>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;nav class=&quot;navbar is-light&quot; role=&quot;navigation&quot; aria-label=&quot;main navigation&quot;&gt;
  &lt;div class=&quot;navbar-brand&quot;&gt;
    &lt;a class=&quot;navbar-item&quot; href=&quot;#&quot;&gt;&lt;strong&gt;Ralma&lt;/strong&gt;&lt;/a&gt;
    &lt;a role=&quot;button&quot; class=&quot;navbar-burger&quot; aria-label=&quot;menu&quot; aria-expanded=&quot;false&quot; data-target=&quot;navbarBasicExample&quot;&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
    &lt;/a&gt;
  &lt;/div&gt;
  &lt;div id=&quot;navbarBasicExample&quot; class=&quot;navbar-menu&quot;&gt;...&lt;/div&gt;
&lt;/nav&gt;</code></pre>
        </figure>

        <div class="content">
          <p><strong>Ralma</strong> template example (structure only):</p>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;navbar light&gt;
  &lt;navbar-brand&gt;
    &lt;navbar-item href=&quot;#&quot;&gt;&lt;strong&gt;Ralma&lt;/strong&gt;&lt;/navbar-item&gt;
    &lt;navbar-burger dataTarget=&quot;navbarBasicExample&quot;&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
    &lt;/navbar-burger&gt;
  &lt;/navbar-brand&gt;
  &lt;navbar-menu id=&quot;navbarBasicExample&quot;&gt;
    &lt;navbar-start&gt;
      &lt;navbar-item href=&quot;#&quot;&gt;Home&lt;/navbar-item&gt;
      &lt;navbar-item-dropdown hoverable&gt;
        &lt;navbar-link&gt;More&lt;/navbar-link&gt;
        &lt;navbar-dropdown&gt;
          &lt;navbar-item href=&quot;#&quot;&gt;About&lt;/navbar-item&gt;
          &lt;navbar-divider /&gt;
          &lt;navbar-item href=&quot;#&quot;&gt;Report an issue&lt;/navbar-item&gt;
        &lt;/navbar-dropdown&gt;
      &lt;/navbar-item-dropdown&gt;
    &lt;/navbar-start&gt;
    &lt;navbar-end&gt;...&lt;/navbar-end&gt;
  &lt;/navbar-menu&gt;
&lt;/navbar&gt;</code></pre>
        </figure>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js" integrity="sha384-J08i8An/QeARD9ExYpvphB8BsyOj3Gh2TSh1aLINKO3L0cMSH2dN3E22zFoXEi0Q" crossorigin="anonymous"></script>
  </body>
</html>
