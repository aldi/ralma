    <header class="bd-header">
      <div class="bd-header-titles">
        <h1 class="title">Modal</h1>
        <p class="subtitle is-4">A classic overlay dialog for important content</p>
      </div>
    </header>

    <section class="section pt-2">
      <div class="container">
        <div class="notification is-warning is-light">
          <p>
            Modals are <code>position: fixed</code> and will cover the whole viewport when
            <code>is-active</code> is applied, so this page shows markup only.
          </p>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;div class=&quot;modal is-active&quot;&gt;
  &lt;div class=&quot;modal-background&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;modal-content&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;Modal content&lt;/div&gt;
  &lt;/div&gt;
  &lt;button class=&quot;modal-close is-large&quot; aria-label=&quot;close&quot; type=&quot;button&quot;&gt;&lt;/button&gt;
&lt;/div&gt;</code></pre>
        </figure>

        <div class="content">
          <p><strong>Ralma</strong> template example:</p>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;modal active&gt;
  &lt;modal-background /&gt;
  &lt;modal-content&gt;
    &lt;div class=&quot;box&quot;&gt;Modal content&lt;/div&gt;
  &lt;/modal-content&gt;
  &lt;modal-close large /&gt;
&lt;/modal&gt;</code></pre>
        </figure>

        <div class="content">
          <p>Modal card variant:</p>
        </div>

        <figure class="highlight">
          <pre><code class="language-html">&lt;modal active&gt;
  &lt;modal-background /&gt;
  &lt;modal-card&gt;
    &lt;modal-card-head&gt;
      &lt;modal-card-title&gt;Title&lt;/modal-card-title&gt;
      &lt;button class=&quot;delete&quot; aria-label=&quot;close&quot; type=&quot;button&quot;&gt;&lt;/button&gt;
    &lt;/modal-card-head&gt;
    &lt;modal-card-body&gt;...&lt;/modal-card-body&gt;
    &lt;modal-card-foot&gt;
      &lt;button class=&quot;button is-success&quot; type=&quot;button&quot;&gt;Save&lt;/button&gt;
      &lt;button class=&quot;button&quot; type=&quot;button&quot;&gt;Cancel&lt;/button&gt;
    &lt;/modal-card-foot&gt;
  &lt;/modal-card&gt;
&lt;/modal&gt;</code></pre>
        </figure>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js" integrity="sha384-J08i8An/QeARD9ExYpvphB8BsyOj3Gh2TSh1aLINKO3L0cMSH2dN3E22zFoXEi0Q" crossorigin="anonymous"></script>
